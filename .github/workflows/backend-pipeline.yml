name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write



jobs:
  backend-pipeline:
    name: Backend Pipeline
    runs-on: ubuntu-latest

    env:
      ALLOW_FEATURE_GHCR_PUSH: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 01a - Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 01b - Dependencies
        run: |

          echo "::group::Install dependencies"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "::endgroup::"

          echo "::group::Check FastAPI"
          python -c "import fastapi; print('FastAPI version:', fastapi.__version__)"
          echo "::endgroup::"

      - name: 02 - Format
        run: |

          echo "::group::Run Ruff formatter check"
          python -m ruff format --check --diff .
          echo "::endgroup::"

      - name: 03 - Linting
        run: |

          echo "::group::Run Ruff linting check"
          python -m ruff check .
          echo "::endgroup::"

      - name: 04 - Typecheck
        run: |

          echo "::group::Run mypy type check"
          python -m mypy app
          echo "::endgroup::"

      - name: 05 - Tests
        run: |

          echo "::group::Run pytest API tests"
          python -m pytest tests -v
          echo "::endgroup::"

      - name: 06 - Coverage
        run: |

          echo "::group::Run pytest with coverage"
          python -m pytest tests -v --cov=app --cov-report=term-missing --cov-report=xml
          echo "::endgroup::"

          echo "::group::Check coverage report file"
          test -f coverage.xml
          echo "coverage.xml was created successfully"
          echo "::endgroup::"

      - name: 07 - Integration Tests
        env:
          DB_CONNECTION_STRING: postgresql+psycopg://app_user:app_password@localhost:5432/python_project
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: python_project
          DB_USER: app_user
          DB_PASSWORD: app_password
        run: |

          echo "::group::Start FastAPI app"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID || true" EXIT
          echo "Started app with PID $APP_PID"
          echo "::endgroup::"

          echo "::group::Wait for app to become available"
          for i in {1..30}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "FastAPI app process stopped unexpectedly"
              echo "Uvicorn logs:"
              cat uvicorn.log
              exit 1
            fi

            if curl -fsS http://127.0.0.1:8000/docs > /dev/null; then
              echo "App is available"
              break
            fi

            echo "Waiting for app..."
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:8000/docs > /dev/null; then
            echo "FastAPI app did not become available"
            echo "Uvicorn logs:"
            cat uvicorn.log
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Run integration tests"
          python -m pytest integration_tests -v
          echo "::endgroup::"

      - name: 08 - API Contract
        run: |

          echo "::group::Run OpenAPI contract tests"
          python -m pytest contract_tests -v
          echo "::endgroup::"

      - name: 09 - Migration Check
        run: |
          echo "The Migration Check step has been completed"
          echo "No database migrations are currently configured"
          echo "The Migration Check therefore remains an organizational placeholder for the time being"

      - name: 10 - Security Scan
        run: |

          echo "::group::Run Bandit static security scan"
          python -m bandit -r app scripts -ll -ii
          echo "::endgroup::"

          echo "::group::Run pip-audit dependency vulnerability scan"
          pip-audit --ignore-vuln CVE-2025-3000
          echo "::endgroup::"

      - name: 11.1 - Read backend version
        run: |
          CURRENT_VERSION=$(cat VERSION | tr -d '[:space:]')

          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"

          echo "Current backend version: $CURRENT_VERSION"

      - name: 11.2 - Check backend version change
        id: version_check
        run: |
          git fetch origin main

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            BASE_REF="${{ github.event.before }}"
          else
            BASE_REF="origin/main"
          fi

          if git cat-file -e "$BASE_REF:VERSION" 2>/dev/null; then
            PREVIOUS_VERSION=$(git show "$BASE_REF:VERSION" | tr -d '[:space:]')
          else
            PREVIOUS_VERSION=""
            echo "No previous VERSION file found."
          fi

          echo "Previous backend version: $PREVIOUS_VERSION"
          echo "Current backend version: $CURRENT_VERSION"

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "Backend version changed."
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "Backend version did not change."
          fi

      - name: 11.3 - Set Docker image name
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            IMAGE_NAME="ghcr.io/${OWNER}/audioexplorer-backend"
          else
            IMAGE_NAME="ghcr.io/${OWNER}/audioexplorer-backend-test"
          fi

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "Image name: $IMAGE_NAME"

      - name: 11.4 - Log in to GitHub Container Registry
        if: github.event_name == 'push' && steps.version_check.outputs.version_changed == 'true' && (github.ref == 'refs/heads/main' || env.ALLOW_FEATURE_GHCR_PUSH == 'true')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 11.5 - Build and optionally push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && steps.version_check.outputs.version_changed == 'true' && (github.ref == 'refs/heads/main' || env.ALLOW_FEATURE_GHCR_PUSH == 'true') }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.CURRENT_VERSION }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: 12 - Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audioexplorer-api-image-${{ github.sha }}
          path: audioexplorer-api-image.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: 13 - Deploy Staging
        run: echo "The Deploy Staging step has been completed. The step remains a placeholder until a staging environment is available."

      - name: 14 - Deploy Production
        run: echo "The Deploy Production step has been completed.The step remains a placeholder until a production environment is available."